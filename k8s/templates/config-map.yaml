apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ .Values.app.name }}-configs

data:
  {{- $envMap := dict "dev" "Development" "stg" "Staging" "prod" "Production" }}
  {{- $envName := index $envMap .Values.app.env | default "Development" }}
  ASPNETCORE_ENVIRONMENT: {{ $envName | quote }}
  AppInfo__Name: {{ .Values.app.name | quote }}
  AppInfo__Version: {{ .Values.app.version | quote }}
  EmailSenderOptions__SmtpServer: {{ .Values.email.smtpServer | quote }}
  EmailSenderOptions__SmtpPort: {{ .Values.email.smtpPort | quote }}
  EmailSenderOptions__SslRequired: {{ .Values.email.sslRequired | quote }}
  EmailSenderOptions__SenderInformation__Name: {{ .Values.email.senderName | quote }}
  EmailSenderOptions__SenderInformation__Address: {{ .Values.email.senderAddress | quote }}
  EmailContent__LogoUrl: {{ .Values.email.logoUrl | quote }}
  EmailContent__DownloadBaseUrl: {{ .Values.email.downloadBaseUrl | quote }}
  AwsCredentials__UseLocalstack: "false"
  MessagingOptions__QueueNames__{{ $.Values.queue.event }}: "{{ $.Values.app.project }}-{{ $.Values.app.env }}-{{ $.Values.queue.name }}"
  {{- range $key, $value := .Values.queueNames }}
  MessagingOptions__QueueNames__{{ $key }}: "{{ $.Values.app.project }}-{{ $.Values.app.env }}-{{ $value }}"
  {{- end }}
